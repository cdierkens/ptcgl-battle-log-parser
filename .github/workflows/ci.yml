name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    # 22 is the declared floor; 24 is current. macOS is in the matrix because
    # the package reads the game's localization cache from a platform-specific
    # path, and `scripts/refresh-templates.ts` branches on platform.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      # Every action is pinned to a commit SHA: a moved tag cannot change what
      # runs here. Dependabot keeps the pins current.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # templates:check re-derives all seven locale bundles from a Pokémon TCG
      # Live install and diffs them against what is committed. It cannot run
      # on a CI runner with no game install, so instead assert the invariant it
      # protects: every bundle has the same 228 keys and no duplicate
      # placeholders. The full extraction check runs locally via
      # `pnpm run verify` before a tag.
      - name: Assert locale bundle invariants
        run: pnpm exec vitest run src/__tests__/locale.test.ts

      # typecheck + lint + test:coverage (which enforces the coverage floor)
      # + build.
      - run: pnpm run verify:ci

  # Proves the published artefact actually loads in a plain Node process —
  # the JSON import attributes are the part a bundler-based test run can mask.
  smoke:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm pack --pack-destination .

      - name: Install the packed tarball and exercise it
        run: |
          mkdir -p /tmp/smoke
          cd /tmp/smoke
          npm init -y > /dev/null
          npm pkg set type=module > /dev/null
          npm install "$GITHUB_WORKSPACE"/*.tgz
          node "$GITHUB_WORKSPACE/scripts/smoke.mjs"

  # One stable status check for branch protection. A matrix job expands into
  # four contexts — "verify (ubuntu-latest, 22)" and friends — which is a
  # brittle thing to enumerate in a required-checks list and would silently stop
  # gating if the matrix ever changed. This collapses them into `ci-ok`.
  ci-ok:
    runs-on: ubuntu-latest
    needs: [verify, smoke]
    # `always()` so this still runs (and fails) when a needed job failed or was
    # skipped; without it the required check would simply never appear.
    if: always()
    steps:
      - if: needs.verify.result != 'success' || needs.smoke.result != 'success'
        run: |
          echo "::error::a required job did not succeed"
          exit 1
      - run: echo "all required jobs succeeded"
