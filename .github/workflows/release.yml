name: Release

# The single sanctioned release action is pushing a `v*` tag. Everything after
# that is automated, tokenless, and provenance-signed.
on:
  push:
    tags: ["v*"]

# Read-only by default; the publish job grants `id-token: write` for itself.
permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    # Required reviewers gate this job. The tag push is the first key; the
    # environment is the second. It is also where a fallback `NPM_TOKEN` would
    # live if trusted publishing ever became unavailable.
    environment:
      name: npm
      url: https://www.npmjs.com/package/@dierkens.dev/ptcgl-battle-log-parser

    permissions:
      contents: read
      # The one permission OIDC trusted publishing needs. There is no
      # NPM_TOKEN anywhere in this workflow, and no `--provenance` flag —
      # npm generates and publishes the attestation automatically.
      id-token: write

    steps:
      # Pinned to a commit SHA: a moved tag cannot change what runs here.
      # Dependabot keeps these current (see .github/dependabot.yml).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false

      # No `registry-url:` on purpose. actions/setup-node writes an
      # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` line when it is
      # set; with NODE_AUTH_TOKEN unset that expands to empty, which npm reads
      # as "auth is already configured" — so it never starts the OIDC exchange
      # and fails with ENEEDAUTH. See actions/setup-node#1551.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.14.0 # the runtime half of the OIDC floor
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Trusted publishing authenticates through the **npm** CLI, which must be
      # >= 11.5.1. Node 22.14.0 satisfies the runtime half of that requirement
      # but bundles npm 10.x, so install npm explicitly rather than depending on
      # whichever version a Node release happens to ship. Without this the
      # publish fails with ENEEDAUTH, because npm 10 does not understand OIDC at
      # all — there is no graceful fallback.
      - run: npm install -g npm@^11.5.1

      # Guard 1 — the tag must name the version being published. A mismatch
      # publishes the wrong version under the right tag, and that cannot be
      # undone.
      - name: Assert the tag matches package.json
        run: |
          set -euo pipefail
          pkg="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$pkg" != "$tag" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${pkg}"
            exit 1
          fi

      # Guard 2 — a release must come from main, so a stray tag on a feature
      # branch cannot publish.
      - name: Assert the tagged commit is on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::${GITHUB_REF_NAME} is not an ancestor of main"
            exit 1
          fi

      # Prereleases go to `next`; final releases move `latest`.
      - name: Choose the dist-tag
        id: dist
        run: |
          set -euo pipefail
          pkg="$(node -p "require('./package.json').version")"
          case "$pkg" in
            *-*) echo "tag=next" >> "$GITHUB_OUTPUT" ;;
            *)   echo "tag=latest" >> "$GITHUB_OUTPUT" ;;
          esac

      # `prepublishOnly` runs the gate (typecheck + lint + test:coverage +
      # build) on publish, so nothing unverified can reach the registry.
      #
      # `npm publish`, not `pnpm publish`. pnpm just shells out to npm for this
      # (pnpm/pnpm#9812), so npm is doing the OIDC exchange either way — being
      # explicit about it means the authentication path does not depend on
      # pnpm's delegation staying as it is. It also means there is no
      # `--no-git-checks` anywhere: that flag only exists because pnpm checks
      # whether a detached HEAD is the publish branch, and npm does not.
      - run: npm publish --access public --tag "${{ steps.dist.outputs.tag }}"
